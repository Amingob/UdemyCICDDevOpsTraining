# Set the root logger level to INFO and attach both Console and File appenders
log4j.rootLogger=INFO, stdout, file

# --- CONSOLE APPENDER ---
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
# Format: [TIMESTAMP] [LEVEL] [CLASS_NAME] - MESSAGE
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# --- FILE APPENDER ---
log4j.appender.file=org.apache.log4j.RollingFileAppender
# Saves logs to a "logs" folder in your project root
log4j.appender.file.File=Logs/automation-test.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c - %m%n
